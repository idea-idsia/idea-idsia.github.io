title: IDeA @ IDSIA
email: idea@idsia.ch
description: >-
    IDeA (Industrial Decision Analytics) is a research group at IDSIA working on
    optimization, multi-agent AI, and decision-support systems for energy,
    mobility, and industrial applications.
baseurl: ""
url: "https://idea.idsia.ch"
google_site_verification: xKyje9TcL_v0v7elV7mKlESppgxt6HZZ0Dv2MSP46wM

# Navigation links (order matters)
nav_links:
    - title: Home
      url: /
    - title: People
      url: /people/
    - title: Projects
      url: /projects/
    - title: Software
      url: /software/
    - title: Publications
      url: /publications/

collections:
    people:
        output: true
        permalink: /people/:name/
    projects:
        output: true
        permalink: /projects/:name/
    software:
        output: true
        permalink: /software/:name/
    publications:
        output: true
        permalink: /publications/:name/

# Build settings
plugins:
    - jekyll-feed
    - jekyll-seo-tag
    - jekyll-sitemap
    - jekyll-wikilinks

wikilinks:
    enabled: true

d3_graph_data:
    enabled: false

sass:
    sass_dir: _sass
    style: compressed

# How many team members to show in the home page preview (set to 0 to show all)
home_team_limit: 0

exclude:
    - Gemfile
    - Gemfile.lock
    - vendor/
    - .bundle/
