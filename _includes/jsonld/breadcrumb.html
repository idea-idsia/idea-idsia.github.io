<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": {{ site.url | jsonify }} },
    { "@type": "ListItem", "position": 2, "name": {{ include.section_name | jsonify }}, "item": {{ site.url | append: include.section_url | jsonify }} },
    { "@type": "ListItem", "position": 3, "name": {{ include.page_name | jsonify }}, "item": {{ page.url | absolute_url | jsonify }} }
  ]
}
</script>
